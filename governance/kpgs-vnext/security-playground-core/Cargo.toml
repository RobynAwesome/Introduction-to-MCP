[package]
name = "kpgs-security-playground-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
publish = false
description = "Fixture-only, read-only Security Playground evidence evaluator"

[[bin]]
name = "spp-core"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
