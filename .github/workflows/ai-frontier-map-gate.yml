name: AI Frontier Map Gate

on:
  pull_request:
    paths:
      - "governance/ai-frontier-map/**"
      - "data/ai-frontier-map/**"
      - "tools/ai_frontier_map/**"
      - ".github/workflows/ai-frontier-map-gate.yml"
  push:
    paths:
      - "governance/ai-frontier-map/**"
      - "data/ai-frontier-map/**"
      - "tools/ai_frontier_map/**"

permissions:
  contents: read

jobs:
  provenance-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate seed provenance records
        run: python tools/ai_frontier_map/validate_corpus.py data/ai-frontier-map/seed.records.jsonl
      - name: Validate collected corpus when present
        shell: bash
        run: |
          if [[ -f data/ai-frontier-map/oya-corpus.jsonl ]]; then
            python tools/ai_frontier_map/validate_corpus.py data/ai-frontier-map/oya-corpus.jsonl
          fi

      - name: Validate five newly discovered upstream sources against the SAME map
        run: |
          python tools/ai_frontier_map/ingest_discoveries.py \
            --input data/ai-frontier-map/intake-2026-11-10.jsonl \
            --output "$RUNNER_TEMP/unified-intake.jsonl"
          python tools/ai_frontier_map/validate_corpus.py "$RUNNER_TEMP/unified-intake.jsonl"
      - name: Negative tests for legacy Oya and new source compatibility
        run: python -m unittest discover -s tools/ai_frontier_map -p "test_*.py" -v

  governance-drill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Entrypoint denial must reject missing acknowledgement
        shell: bash
        run: |
          if python scripts/kc_kpgs_governance.py entry --renter-id ci_frontier_probe --assert > "$RUNNER_TEMP/denied.txt" 2>&1; then
            echo "FAIL: renter entry silently accepted absent acknowledgement"
            exit 1
          fi
          cat "$RUNNER_TEMP/denied.txt"
      - name: Run real KPGS CLI renter entry on disposable checkout
        run: |
          python scripts/kc_kpgs_governance.py entry \
            --renter-id ci_frontier_probe --renter-class stateless_renter \
            --assert --hood-ack I_AM_STATELESS_RENTER_NOT_LANDLORD
      - name: Run existing Black Mask v0.5 and Bracket stress CLI (no persisted report)
        run: python scripts/kc_blackmask_bracket_stress.py --no-report-file --operator CI_FRONTIER --json
      - name: Exercise existing Security Playground fail-closed fixture gate
        run: python -m unittest discover -s tests -p "test_security_playground_inventory_gate.py" -v
      - name: Exercise actual Main Brain roadmap gate on disposable runner
        shell: bash
        run: |
          set +e
          python scripts/kc_main_brain_roadmap.py gate > "$RUNNER_TEMP/roadmap-gate.txt" 2>&1
          result=$?
          set -e
          cat "$RUNNER_TEMP/roadmap-gate.txt"
          grep -q "roadmap_gate" "$RUNNER_TEMP/roadmap-gate.txt" || {
            echo "Gate did not emit a recognizable decision"
            exit 1
          }
          echo "Main Brain gate exit: $result (runner-only evidence; does not authorize real production)"
          if [[ "$result" -eq 0 ]]; then
            echo "WARNING: fixture/checkout gate accepted; this does NOT prove serving production authority"
          else
            echo "HOLD: missing production bar / other gate condition in disposable checkout"
          fi
