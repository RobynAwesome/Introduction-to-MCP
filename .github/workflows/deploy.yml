name: "Kopano Context: Production Hardening Deployment"

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authorize:
    name: Authorize production invocation
    runs-on: ubuntu-latest
    outputs:
      authorized: ${{ steps.gate.outputs.authorized }}
      reason: ${{ steps.gate.outputs.reason }}
      production_paths: ${{ steps.gate.outputs.production_paths }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Classify deploy authorization
        id: gate
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            python scripts/ci/production_deploy_gate.py \
              --explicit-release \
              --github-output "$GITHUB_OUTPUT"
            exit 0
          fi

          changed_files="${RUNNER_TEMP}/production-deploy-changed-files.txt"

          if [[ -z "${BEFORE_SHA}" || "${BEFORE_SHA}" == "0000000000000000000000000000000000000000" ]]; then
            git show --pretty="" --name-only "$GITHUB_SHA" > "$changed_files"
          else
            git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA" > "$changed_files"
          fi

          python scripts/ci/production_deploy_gate.py \
            --github-output "$GITHUB_OUTPUT" \
            < "$changed_files"

      - name: Record invocation decision
        shell: bash
        run: |
          echo "### WYC-01 production invocation" >> "$GITHUB_STEP_SUMMARY"
          echo "- authorized: ${{ steps.gate.outputs.authorized }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- reason: ${{ steps.gate.outputs.reason }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- production paths: ${{ steps.gate.outputs.production_paths || 'none' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- invariant: FAILURE_SURFACED_BY_CALL != FAILURE_CAUSED_BY_CHANGE" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy authorized production change
    needs: authorize
    if: needs.authorize.outputs.authorized == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: KPGS Azure credential preflight
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          missing=()
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            joined="$(IFS=,; echo "${missing[*]}")"
            echo "::error title=KPGS_DEPLOY_HOLD::Missing required GitHub Actions secrets: $joined"
            {
              echo "### [KPGS_DEPLOY_HOLD] Azure production credentials unavailable"
              echo "- missing secrets: $joined"
              echo "- invariant: REQUIRED_DEPLOY_CREDENTIAL_MISSING -> HOLD"
              echo "- evidence: see Issue #211"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          {
            echo "### [KPGS_DEPLOY_PREFLIGHT] Azure credential contract present"
            echo "- required secret names: present"
            echo "- next gate: azure/login@v3"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Log in to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install azd
        run: curl -fsSL https://aka.ms/install-azd.sh | bash

      - name: Provision & Deploy (azd)
        run: |
          azd config set alpha.resourceGroupDeployments on
          azd up --no-prompt
        env:
          AZURE_ENV_NAME: prod
          AZURE_LOCATION: southafricanorth
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          # Secrets are pulled from Key Vault at runtime via Bicep
